name: OIDC debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Report the toolchain before the upgrade
        run: |
          echo "node $(node -v)"
          echo "npm $(npm -v) at $(which npm)"

      - run: npm install -g npm@latest

      - name: Report the toolchain after the upgrade
        run: |
          echo "node $(node -v)"
          echo "npm $(npm -v) at $(which npm)"
          echo "registry: $(npm config get registry)"

      - name: Report the claims npm sends to the registry
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          node -e '
            const payload = process.argv[1].split(".")[1];
            const claims = JSON.parse(Buffer.from(payload, "base64url").toString());
            for (const name of ["repository", "repository_owner", "job_workflow_ref", "workflow_ref", "environment", "ref", "aud"]) {
              console.log(`${name}: ${claims[name] ?? "(absent)"}`);
            }
          ' "$token"
